name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本唯一来源：src-tauri/tauri.conf.json。标签必须与之完全一致。
      - name: Verify tag matches version
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "conf=$CONF_VER pkg=$PKG_VER cargo=$CARGO_VER tag=$TAG_VER"
          for v in "$PKG_VER" "$CARGO_VER" "$TAG_VER"; do
            if [ "$v" != "$CONF_VER" ]; then
              echo "::error::版本不一致：tauri.conf.json=$CONF_VER 但 $v 不匹配"
              exit 1
            fi
          done

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 缓存 pip 下载与安装结果：后端依赖约 2GB，不缓存时每次都要重下，
      # 这是 CI 慢的主因。key 绑到 requirements.txt，改了依赖才失效。
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\pip\cache
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Install backend deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # insightface 会拉 CPU 版 onnxruntime，装完再换 DirectML 版。
          # 去掉 --force-reinstall：它会把 onnxruntime 及其依赖整个重装一遍，
          # 在 CI 上是分钟级浪费；--no-deps 只换这一个包即可。
          pip install -r requirements.txt
          pip install --no-deps --force-reinstall onnxruntime-directml
          pip install pyinstaller

      # sidecar 必须是打包前就位的资源，否则 Tauri bundle 找不到。
      # build-backend/ 是构建产物目录（不入库），CI 里现建。
      #
      # 用 --windowed：正式版绝不能弹控制台黑窗。
      # 代价是没有 stdout，所以后端日志一律写 <数据目录>/logs/backend.log，
      # 用户反馈问题时让 TA 提供该文件即可。已实测该模式下
      # sys.stderr 为 None，app.py 的日志初始化必须能容忍这一点。
      # 不打包 debug 版（会多 457MB，安装包翻倍）；需要看后端输出的人
      # 直接用源码跑 backend/app.py 就行。
      - name: Build sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-backend, dist-backend | Out-Null
          Push-Location build-backend
          try {
            python -m PyInstaller --name jury-backend --onefile ../backend/app.py `
              --distpath ../dist-backend --workpath ./work --specpath . `
              --noconfirm --clean --windowed `
              --hidden-import=mediapipe.tasks.python `
              --hidden-import=mediapipe.tasks.python.vision `
              --hidden-import=mediapipe.tasks.python.vision.face_landmarker `
              --hidden-import=mediapipe.tasks.c `
              --hidden-import=insightface.app `
              --hidden-import=insightface.utils.face_align `
              --hidden-import=pyiqa.archs.musiq_arch `
              --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state `
              --collect-binaries=mediapipe `
              --collect-data=mediapipe
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller 失败" }
          } finally { Pop-Location }

          $exe = "dist-backend/jury-backend.exe"
          if (-not (Test-Path $exe)) { throw "产物缺失: $exe" }

          # 防回归（真正的验收）：让产物自己 import 一遍并实调 torchvision::nms。
          # 函数内延迟导入的模块 PyInstaller 静态分析看不到，源码环境跑一万遍
          # 也发现不了；而读 warn-*.txt 做文本匹配必然被无害的可选缺失
          # （fcntl/wandb/albumentations 等）干扰，写出来就是误报。
          # 实测：故意漏收 torchvision 时这里的退出码为 1。
          & $exe --doctor
          if ($LASTEXITCODE -ne 0) {
            throw "sidecar --doctor 未通过：打包缺少运行期依赖（详见上面的 FAIL 行）"
          }

          # 防回归：确认是 GUI 子系统（Subsystem=2），否则用户会看到控制台黑窗。
          # 0.1.8 就是这么漏的——本地 spec 是 console=True，CI 是 --windowed，
          # 两条构建路径不一致，用户装到了带控制台的版本。
          $fs = [IO.File]::OpenRead((Resolve-Path $exe))
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 0x5C
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) {
            throw "sidecar 不是 GUI 子系统（Subsystem=$subsystem，应为 2），会弹控制台"
          }
          Write-Host "Subsystem=2 校验通过（无控制台窗口）"
          Get-ChildItem dist-backend | Format-Table Name, Length

      - name: Build Tauri bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 必须连同 .sig 一起收集：latest.json 要用它，缺了会被下面的步骤拒绝
      # 只收 NSIS：更新器只用 setup.exe，MSI 与它功能重叠且多 457MB，已停发
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/ 2>/dev/null || true
          echo "--- 收集到的文件 ---"
          ls -lh out/
          if ! ls out/*-setup.exe.sig >/dev/null 2>&1; then
            echo "::error::未生成 NSIS 安装包签名，检查 TAURI_SIGNING_PRIVATE_KEY 是否已配置"
            exit 1
          fi

      # 便携版：exe + 随包 sidecar + 前端产物，解压即用
      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = node -p "require('./src-tauri/tauri.conf.json').version"
          $stage = "stage/JuryMate-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/jurymate.exe" "$stage/JuryMate.exe"
          Copy-Item "dist-backend" "$stage/dist-backend" -Recurse
          Copy-Item "README.md","LICENSE","RELEASE_NOTES_CURRENT.md" $stage
          Compress-Archive -Path $stage -DestinationPath "out/JuryMate_${ver}_x64.zip" -Force
          Get-ChildItem out | Format-Table Name, Length

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -File |
            Where-Object { $_.Extension -in '.exe','.zip' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      # Tauri updater 需要 latest.json。只有 Tauri 自己产出的安装包才有 .sig，
      # 手工压的便携 ZIP 无签名，绝不能写进清单（客户端会验签失败）。
      - name: Generate updater manifest
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          export VER
          node -e '
            const fs=require("fs"),crypto=require("crypto"),path=require("path");
            const out="out", ver=process.env.VER;
            const files=fs.readdirSync(out);
            const platforms={};
            // NSIS 安装包作为自动更新载体（Windows 目标键固定）
            const setup=files.find(f=>/-setup\.exe$/i.test(f));
            if(!setup){
              console.error("未找到 NSIS 安装包，无法生成 latest.json");
              process.exit(1);
            }
            const sigPath=path.join(out,setup+".sig");
            if(!fs.existsSync(sigPath)){
              console.error("安装包缺少 .sig 签名，拒绝生成未签名清单");
              process.exit(1);
            }
            const sha=crypto.createHash("sha256")
              .update(fs.readFileSync(path.join(out,setup))).digest("hex");
            platforms["windows-x86_64"]={
              signature: fs.readFileSync(sigPath,"utf8").trim(),
              url: "https://github.com/"+process.env.GITHUB_REPOSITORY
                   +"/releases/download/v"+ver+"/"+setup
            };
            const manifest={
              version: ver,
              notes: fs.readFileSync("RELEASE_NOTES_CURRENT.md","utf8"),
              pub_date: new Date().toISOString(),
              platforms
            };
            fs.writeFileSync(path.join(out,"latest.json"), JSON.stringify(manifest,null,2));
            console.log("updater 载体:", setup);
            console.log("sha256:", sha);
          '
          cat out/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: JuryMate ${{ github.ref_name }}
          body_path: RELEASE_NOTES_CURRENT.md
          draft: false
          prerelease: false
          files: |
            out/*.exe
            out/*.zip
            out/*.sig
            out/latest.json
            out/SHA256SUMS.txt

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
