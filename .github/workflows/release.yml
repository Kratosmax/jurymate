name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只验证构建与校验，不创建 Release（用于验证 CI 本身）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本唯一来源：src-tauri/tauri.conf.json。标签必须与之完全一致。
      #
      # 手动触发（workflow_dispatch）时 GITHUB_REF_NAME 是分支名而非标签，
      # 拿它比对必然失败。这种情况跳过标签比对，只校验三个文件内部一致。
      - name: Verify tag matches version
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "conf=$CONF_VER pkg=$PKG_VER cargo=$CARGO_VER ref=$GITHUB_REF_NAME"
          for v in "$PKG_VER" "$CARGO_VER"; do
            if [ "$v" != "$CONF_VER" ]; then
              echo "::error::版本不一致：tauri.conf.json=$CONF_VER 但 $v 不匹配"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$CONF_VER" ]; then
              echo "::error::标签版本 $TAG_VER 与 tauri.conf.json $CONF_VER 不一致"
              exit 1
            fi
            echo "标签校验通过：v$TAG_VER"
          else
            echo "非标签触发（$GITHUB_REF_TYPE），跳过标签比对；三处文件版本一致：$CONF_VER"
          fi

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 缓存 pip 下载与安装结果：后端依赖约 2GB，不缓存时每次都要重下，
      # 这是 CI 慢的主因。key 绑到 requirements.txt，改了依赖才失效。
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\pip\cache
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Install backend deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # insightface 会拉 CPU 版 onnxruntime，装完再换 DirectML 版。
          # 去掉 --force-reinstall：它会把 onnxruntime 及其依赖整个重装一遍，
          # 在 CI 上是分钟级浪费；--no-deps 只换这一个包即可。
          pip install -r requirements.txt
          pip install --no-deps --force-reinstall onnxruntime-directml
          pip install pyinstaller

      # sidecar 必须是打包前就位的资源，否则 Tauri bundle 找不到。
      # build-backend/ 是构建产物目录（不入库），CI 里现建。
      #
      # 用 --windowed：正式版绝不能弹控制台黑窗。
      # 代价是没有 stdout，所以后端日志一律写 <数据目录>/logs/backend.log，
      # 用户反馈问题时让 TA 提供该文件即可。已实测该模式下
      # sys.stderr 为 None，app.py 的日志初始化必须能容忍这一点。
      # 不打包 debug 版（会多 457MB，安装包翻倍）；需要看后端输出的人
      # 直接用源码跑 backend/app.py 就行。
      - name: Build sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-backend, dist-backend | Out-Null
          # 评分已改为 ONNX：torch/torchvision/pyiqa 全部排除，安装包不再背 365MB torch。
          Push-Location build-backend
          try {
            python -m PyInstaller --name jury-backend --onedir ../backend/app.py `
              --distpath ../dist-backend --workpath ./work --specpath . `
              --noconfirm --clean --windowed `
              --hidden-import=mediapipe.tasks.python `
              --hidden-import=mediapipe.tasks.python.vision `
              --hidden-import=mediapipe.tasks.python.vision.face_landmarker `
              --hidden-import=mediapipe.tasks.c `
              --hidden-import=insightface.app `
              --hidden-import=insightface.utils.face_align `
              --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state `
              --hidden-import=onnx_score `
              --exclude-module=torch `
              --exclude-module=torchvision `
              --exclude-module=pyiqa `
              --exclude-module=pandas `
              --exclude-module=pyarrow `
              --exclude-module=numba `
              --exclude-module=llvmlite `
              --collect-binaries=mediapipe `
              --collect-data=mediapipe
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller 失败" }
          } finally { Pop-Location }

          $exe = "dist-backend/jury-backend/jury-backend.exe"
          if (-not (Test-Path $exe)) { throw "产物缺失: $exe" }

          # 防回归（真正的验收）：让产物自己 import 一遍 onnxruntime / onnx_score。
          # 函数内延迟导入的模块 PyInstaller 静态分析看不到，源码环境跑一万遍
          # 也发现不了；而读 warn-*.txt 做文本匹配必然被无害的可选缺失
          # （fcntl/wandb/albumentations 等）干扰，写出来就是误报。
          #
          # sidecar 是 --windowed 打包，没有控制台，print() 进不了 CI 日志
          # （实测确认过：只看到源码回显、看不到 [ OK ] 行）。
          # 所以必须把落盘的 doctor.log 打出来，否则"通过"可能是"根本没跑"。
          # 必须 Start-Process -Wait：sidecar 是 GUI 子系统（--windowed），
          # PowerShell 用 & 调用会立即返回，$LASTEXITCODE 不可靠、日志来不及
          # 产出。实测：& 调用时 doctor.log 不生成；Start-Process -Wait 正常。
          # 这是"doctor 像是通过了但日志里没输出"的真正原因。
          $docLog = Join-Path (Get-Location) "doctor.log"
          Remove-Item $docLog -Force -ErrorAction SilentlyContinue
          $docProc = Start-Process -FilePath $exe `
            -ArgumentList @("--doctor","--doctor-out",$docLog) `
            -PassThru -Wait -WindowStyle Hidden
          if (Test-Path $docLog) {
            Write-Host "--- doctor.log ---"
            Get-Content $docLog | ForEach-Object { Write-Host "    $_" }
          } else {
            throw "doctor 未产出 doctor.log（退出码 $($docProc.ExitCode)），无法确认自检真的执行了"
          }
          if ($docProc.ExitCode -ne 0) {
            throw "sidecar --doctor 未通过（退出码 $($docProc.ExitCode)）：打包缺少运行期依赖"
          }

          # 防回归：确认是 GUI 子系统（Subsystem=2），否则用户会看到控制台黑窗。
          # 0.1.8 就是这么漏的——本地 spec 是 console=True，CI 是 --windowed，
          # 两条构建路径不一致，用户装到了带控制台的版本。
          $fs = [IO.File]::OpenRead((Resolve-Path $exe))
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 0x5C
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) {
            throw "sidecar 不是 GUI 子系统（Subsystem=$subsystem，应为 2），会弹控制台"
          }
          Write-Host "Subsystem=2 校验通过（无控制台窗口）"
          Get-ChildItem dist-backend | Format-Table Name, Length

      - name: Build engine package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: \${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: \${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = if ($pkg.engineVersion) { [string]$pkg.engineVersion } else { [string]$pkg.version }
          $out = "dist-engine"
          $stage = Join-Path $out "JuryMate_Engine_$ver"
          $zip = Join-Path $out "JuryMate_Engine_$($ver)_x64.zip"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist-backend/jury-backend" $stage -Recurse
          [IO.File]::WriteAllText((Join-Path $stage "engine.json"), (@{ version = $ver } | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          Remove-Item "$zip.sig" -Force -ErrorAction SilentlyContinue
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if ($key) {
            $key = $key.Trim()
            $key = $key.TrimStart([char]92)
          }
          try {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            npx tauri signer sign --app-version $ver --private-key $key $zip
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$zip.sig")) { throw "引擎包签名失败" }
          } finally {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
          }
          $sig = (Get-Content "$zip.sig" -Raw).Trim()
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $ver
            notes = "JuryMate 引擎 v$ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/Kratosmax/jurymate/releases/download/engine/JuryMate_Engine_$($ver)_x64.zip"
                sha256 = $sha
              }
            }
          } | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText((Join-Path $out "engine.json"), $manifest, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem $out | Format-Table Name, Length

      - name: Build Tauri bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 必须连同 .sig 一起收集：latest.json 要用它，缺了会被下面的步骤拒绝
      # 只收 NSIS：更新器只用 setup.exe，MSI 与它功能重叠且多 457MB，已停发
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/ 2>/dev/null || true
          cp dist-engine/*.zip out/ 2>/dev/null || true
          cp dist-engine/*.zip.sig out/ 2>/dev/null || true
          cp dist-engine/engine.json out/ 2>/dev/null || true
          echo "--- 收集到的文件 ---"
          ls -lh out/
          if ! ls out/*-setup.exe.sig >/dev/null 2>&1; then
            echo "::error::未生成 NSIS 安装包签名，检查 TAURI_SIGNING_PRIVATE_KEY 是否已配置"
            exit 1
          fi

      # 便携版只装 UI 壳；引擎用独立的 JuryMate_Engine_*.zip 分发
      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = node -p "require('./src-tauri/tauri.conf.json').version"
          $stage = "stage/JuryMate-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/jurymate.exe" "$stage/JuryMate.exe"
          Copy-Item "README.md","LICENSE","RELEASE_NOTES_CURRENT.md" $stage
          Compress-Archive -Path $stage -DestinationPath "out/JuryMate_$($ver)_x64.zip" -Force
          Get-ChildItem out | Format-Table Name, Length

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -File |
            Where-Object { $_.Extension -in '.exe','.zip' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      # Tauri updater 需要 latest.json。只有 Tauri 自己产出的安装包才有 .sig，
      # 手工压的便携 ZIP 无签名，绝不能写进清单（客户端会验签失败）。
      - name: Generate updater manifest
        shell: bash
        env:
          # 版本取 tauri.conf.json 而非 ref_name：
          # workflow_dispatch 触发时 ref_name 是分支名（如 master），
          # 拼出来会变成 releases/download/vmaster/… 这种坏 URL。
          # 标签触发时两者一致，所以统一用文件里的版本更稳。
          VER: ${{ github.ref_name }}
        run: |
          VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          export VER
          echo "清单版本: $VER（来源 tauri.conf.json，而非 ref=${{ github.ref_name }}）"
          node -e '
            const fs=require("fs"),crypto=require("crypto"),path=require("path");
            const out="out", ver=process.env.VER;
            const files=fs.readdirSync(out);
            const platforms={};
            // NSIS 安装包作为自动更新载体（Windows 目标键固定）
            const setup=files.find(f=>/-setup\.exe$/i.test(f));
            if(!setup){
              console.error("未找到 NSIS 安装包，无法生成 latest.json");
              process.exit(1);
            }
            const sigPath=path.join(out,setup+".sig");
            if(!fs.existsSync(sigPath)){
              console.error("安装包缺少 .sig 签名，拒绝生成未签名清单");
              process.exit(1);
            }
            const sha=crypto.createHash("sha256")
              .update(fs.readFileSync(path.join(out,setup))).digest("hex");
            platforms["windows-x86_64"]={
              signature: fs.readFileSync(sigPath,"utf8").trim(),
              url: "https://github.com/"+process.env.GITHUB_REPOSITORY
                   +"/releases/download/v"+ver+"/"+setup
            };
            const manifest={
              version: ver,
              notes: fs.readFileSync("RELEASE_NOTES_CURRENT.md","utf8"),
              pub_date: new Date().toISOString(),
              platforms
            };
            fs.writeFileSync(path.join(out,"latest.json"), JSON.stringify(manifest,null,2));
            console.log("updater 载体:", setup);
            console.log("sha256:", sha);
          '
          cat out/latest.json

      # dry_run（或非标签触发）时只校验产物，不创建 Release。
      # 这样可以在不打标签的前提下把整条 CI 链路真跑一遍——
      # 否则"CI 能不能过"永远只能等真正发布时才知道，一次白等 20 分钟。
      - name: Create Release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          name: JuryMate ${{ github.ref_name }}
          body_path: RELEASE_NOTES_CURRENT.md
          draft: false
          prerelease: false
          files: |
            out/*.exe
            out/*.zip
            out/*.sig
            out/latest.json
            out/engine.json
            out/SHA256SUMS.txt

      # 引擎走独立 engine 通道：UI Release 更新不会重复上传 180MB 引擎。
      - name: Publish engine channel
        if: \${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: pwsh
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "engine"
          $assets = @(Get-ChildItem out -File |
            Where-Object { $_.Name -like "JuryMate_Engine_*.zip*" -or $_.Name -eq "engine.json" } |
            ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "缺少引擎资产" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag --title "JuryMate Engine Channel" --notes "独立引擎通道；版本见 engine.json" --latest=false @assets
          }
          if ($LASTEXITCODE -ne 0) { throw "引擎通道发布失败" }

      - name: Verify release assets
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'

      # dry-run 的产出清单：即使不发布，也要能看到 UI 与引擎资产都在
      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
        shell: bash
        run: |
          echo "=== dry-run：不创建 Release，仅列出将被发布的资产 ==="
          ls -lh out/
          test -f out/latest.json || { echo "::error::缺少 latest.json"; exit 1; }
          test -f out/engine.json || { echo "::error::缺少 engine.json"; exit 1; }
          ls out/*-setup.exe >/dev/null || { echo "::error::缺少 UI setup.exe"; exit 1; }
          ls out/*-setup.exe.sig >/dev/null || { echo "::error::缺少 UI .sig"; exit 1; }
          ls out/JuryMate_Engine_*.zip >/dev/null || { echo "::error::缺少引擎 ZIP"; exit 1; }
          ls out/JuryMate_Engine_*.zip.sig >/dev/null || { echo "::error::缺少引擎 ZIP .sig"; exit 1; }
          echo "dry-run 通过：构建、doctor、UI/引擎签名、清单全部正常"
